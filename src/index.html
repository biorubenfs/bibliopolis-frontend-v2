<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Bibliopolis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Applies the stored colour scheme before the app boots; see ThemeService -->
    <script>
      try {
        const theme = localStorage.getItem('bibliopolis.theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
