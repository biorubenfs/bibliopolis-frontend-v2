<h1>Explorar</h1>

@switch (state()) {
  @case ('error') {
    <div class="status" role="alert">
      <mat-icon aria-hidden="true">cloud_off</mat-icon>
      <p>No se han podido cargar los libros.</p>
      <button mat-stroked-button type="button" (click)="load()">Reintentar</button>
    </div>
  }
  @default {
    @if (state() === 'loaded' && latest().length === 0) {
      <div class="status empty">
        <mat-icon aria-hidden="true">auto_stories</mat-icon>
        <h2>Aún no hay libros en Bibliopolis</h2>
        <p>Aquí aparecerán los últimos libros que se den de alta.</p>
      </div>
    } @else {
      <app-book-shelf
        heading="Novedades en Bibliopolis"
        subheading="Los últimos libros dados de alta"
        [books]="latest()"
        [loading]="state() === 'loading'"
        (openRequested)="openBook($event)"
      />
    }
  }
}
