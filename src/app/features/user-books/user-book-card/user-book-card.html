<article class="card">
  <div class="cover">
    @if (book().bookCoverUrl && !coverFailed()) {
      <!-- Empty alt: the cover is decorative because the title is right next to it -->
      <img
        [src]="book().bookCoverUrl"
        alt=""
        width="96"
        height="144"
        loading="lazy"
        (error)="coverFailed.set(true)"
      />
    } @else {
      <mat-icon class="placeholder" aria-hidden="true">menu_book</mat-icon>
    }
  </div>

  <div class="info">
    <h2 class="title">
      <!-- Its clickable area covers the whole card, see .open in the styles -->
      <button type="button" class="open" aria-haspopup="dialog" (click)="openRequested.emit()">
        {{ book().bookTitle }}
      </button>
    </h2>
    <p class="authors">{{ authors() }}</p>

    @if (book().rating !== null) {
      <p class="rating">
        <!-- The star is the only hint of what the number means, so screen readers must get it -->
        <mat-icon aria-hidden="false" aria-label="Valoración">star</mat-icon>
        {{ book().rating }}/10
      </p>
    }

    <div class="isbn">
      <p>ISBN-13: {{ book().bookIsbn13 }}</p>
      @if (book().bookIsbn10; as isbn10) {
        <p>ISBN-10: {{ isbn10 }}</p>
      }
    </div>

    <div class="actions">
      <button
        mat-icon-button
        type="button"
        class="remove"
        matTooltip="Quitar de la biblioteca"
        [attr.aria-label]="'Quitar ' + book().bookTitle + ' de la biblioteca'"
        (click)="removeRequested.emit()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</article>
