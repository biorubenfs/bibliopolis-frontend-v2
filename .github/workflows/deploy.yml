name: Deploy Frontend

on:
  push:
    branches:
      - main        # Deploys to DEV
      - production  # Deploys to PRODUCTION
  workflow_dispatch: # Allows running it manually from GitHub
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - production

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # The manual input wins; otherwise the environment comes from the branch
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'dev') }}
      url: ${{ (github.event.inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'dev')) == 'production' && 'https://bibliopolis.es' || 'https://dev.bibliopolis.es' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The pnpm version comes from "packageManager" in package.json
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Build configurations are named after the GitHub environments
    - name: Build project
      run: pnpm run build --configuration ${{ github.event.inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'dev') }}

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      run: |
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          dist/bibliopolis-frontend-v2/browser/ \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

    - name: Cleanup SSH key
      if: always()
      run: rm -f ~/.ssh/id_rsa
