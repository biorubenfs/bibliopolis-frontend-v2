name: Deploy dev

# Se lanza a mano desde cualquier rama: compila con la configuración `dev` y la despliega en el entorno dev del VPS.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.bibliopolis.es

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build --configuration dev

      # Lets `curl https://dev.bibliopolis.es/version.json` tell which branch and commit are deployed
      - name: Write version.json
        run: |
          cat > dist/bibliopolis-frontend-v2/browser/version.json << EOF
          {
            "version": "$(node -p "require('./package.json').version")",
            "ref": "${{ github.ref_name }}",
            "sha": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            dist/bibliopolis-frontend-v2/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
