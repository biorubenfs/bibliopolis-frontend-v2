name: Release

# Se lanza a mano y solo desde main. Sube la versión del package.json (commit + tag vX.Y.Z),
# compila con la configuración `production`, la despliega en el entorno de producción del VPS
# y crea la GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de versión'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bibliopolis.es

    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::La release solo puede lanzarse desde main (ref actual: ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "chore: release v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: pnpm run build --configuration production

      - name: Write version.json
        run: |
          cat > dist/bibliopolis-frontend-v2/browser/version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "ref": "v${{ steps.version.outputs.version }}",
            "sha": "$(git rev-parse HEAD)",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      # Solo se publican el commit y el tag si el build ha ido bien: un build roto no deja un tag sin despliegue.
      - name: Push commit and tag
        run: git push --follow-tags

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            dist/bibliopolis-frontend-v2/browser/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
