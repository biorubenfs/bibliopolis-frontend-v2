name: CI

on:
  push:
    # main and production run this workflow through deploy.yml
    branches-ignore:
      - main
      - production
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The pnpm version comes from "packageManager" in package.json
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build project
      run: pnpm run build --configuration production

    - name: Run tests
      run: pnpm run test --watch=false
